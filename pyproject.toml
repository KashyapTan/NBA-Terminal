[project]
name = "nba-terminal"
version = "0.1.0"
description = "PyQt NBA terminal for player analytics, predictions, defense boards, consistency, slate scanning, and NBA API exploration."
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "nba_api>=1.10",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.5",
    "pytest>=8.0",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "coverage>=7.5",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
nba-terminal = "nba_terminal.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "archive",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
branch = true
source = ["nba_terminal"]
omit = [
    "nba_terminal/__main__.py",
    "nba_terminal/app.py",
    "nba_terminal/pages/*",
    "nba_terminal/services/api_catalog.py",
    "nba_terminal/services/consistency.py",
    "nba_terminal/services/nba_fetchers.py",
    "nba_terminal/services/player_data.py",
    "nba_terminal/services/projections.py",
    "nba_terminal/services/slate.py",
    "nba_terminal/theme.py",
    "nba_terminal/ui/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"

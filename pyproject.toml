[project]
name = "nba-terminal"
version = "0.1.0"
description = "Responsive NBA analytics web terminal backed by NBA Stats."
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "nba_api>=1.10",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.5",
    "pytest>=8.0",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "coverage>=7.5",
    "httpx2>=2.13.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[project.scripts]
nba-terminal = "nba_terminal.webapp:main"
nba-terminal-desktop = "nba_terminal.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["nba_terminal/**/*.py", "nba_terminal/web/dist/**", "nba_terminal/data/picks/**", "nba_terminal/assets/fonts/**"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "archive",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
branch = true
source = ["nba_terminal.webapp", "nba_terminal.services.game_center"]

[tool.coverage.report]
fail_under = 93
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
